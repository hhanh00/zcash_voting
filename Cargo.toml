[workspace]
members = [
    "zcash_voting",
    "vote-commitment-tree",
    "vote-commitment-tree-client",
]
exclude = ["wallet-example"]
resolver = "2"

[workspace.dependencies]
# orchard, voting-circuits, and librustzcash all resolve to the same Orchard
# release, keeping the dependency graph type-compatible across PCZT construction
# and vote proofs.
orchard = { version = "0.15", features = ["unstable-voting-circuits"] }
voting-circuits = "=0.10.0"

# These published librustzcash versions include the Ironwood historical selector.
pczt = { version = "0.9.1", features = ["orchard", "io-finalizer", "signer", "zcp-builder"] }
zcash_client_backend = { version = "0.24.0-rc.3", default-features = false, features = ["orchard", "lightwalletd-tonic", "lightwalletd-tonic-tls-webpki-roots"] }
zcash_keys = { version = "0.16.0", features = ["orchard"] }
zcash_primitives = { version = "0.30.0" }
zcash_protocol = { version = "0.10.0" }

# Patched pir-client: the async PirClient lacks a public circuit_root
# accessor (private field); hosts genericizing over a PIR proof source need
# one. Branch feat/async-circuit-root-getter.
[patch.crates-io]
pir-client = { git = "https://github.com/hhanh00/vote-nullifier-pir.git", rev = "b704640df339a98330a5b8e4582144fde67d0b0c" }
